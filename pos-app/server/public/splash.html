<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SaSLoop Master POS</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100vw;
      height: 100vh;
      background: transparent !important;
      overflow: hidden;
      -webkit-user-select: none;
      user-select: none;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    /* Container for the central layout animation */
    .animation-container {
      position: relative;
      width: 680px;
      height: 680px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Devices layer containing the 4 icons and wires */
    .devices-layer {
      position: absolute;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: blur-layer 0.8s cubic-bezier(0.25, 1, 0.5, 1) 5.4s forwards;
    }

    @keyframes blur-layer {
      to {
        filter: blur(8px);
        opacity: 0.25;
      }
    }

    /* Each vector icon — starts invisible */
    .icon {
      position: absolute;
      opacity: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      z-index: 5;
      filter: drop-shadow(0 0 15px rgba(0,0,0,0.6));
      transition: filter 0.4s ease;
    }

    /* Labels under each icon */
    .icon-label {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      text-shadow: 0 2px 10px rgba(0,0,0,0.9), 0 0 6px rgba(0,0,0,0.8);
    }

    /* ====== 1. POS Terminal — flies in from FAR LEFT DISPLAY EDGE ====== */
    .icon-pos {
      animation: fly-pos 0.9s cubic-bezier(0.16, 1, 0.3, 1) 0.1s forwards, pos-glow-change 0.4s ease 0.9s forwards;
    }
    .icon-pos .icon-label { color: #18ba60; }

    @keyframes fly-pos {
      0%   { opacity: 0; transform: translate(-70vw, 0) scale(0.5) rotate(-15deg); }
      60%  { opacity: 1; }
      100% { opacity: 1; transform: translate(-150px, 0) scale(1) rotate(0deg); }
    }
    @keyframes pos-glow-change {
      to { filter: drop-shadow(0 0 25px rgba(24,186,96,0.8)) drop-shadow(0 0 8px rgba(24,186,96,0.6)); }
    }

    /* POS Screen Power-On inside SVG */
    .pos-screen {
      fill: #090d16;
      stroke: #475569;
      animation: pos-power 0.4s ease 0.9s forwards;
    }
    .pos-content {
      opacity: 0;
      animation: fade-in 0.4s ease 1.0s forwards;
    }
    @keyframes pos-power {
      to { fill: #18ba60; fill-opacity: 0.25; stroke: #18ba60; }
    }

    /* ====== 2. KDS — flies in from FAR RIGHT DISPLAY EDGE ====== */
    .icon-kds {
      animation: fly-kds 0.9s cubic-bezier(0.16, 1, 0.3, 1) 1.2s forwards, kds-glow-change 0.4s ease 2.4s forwards;
    }
    .icon-kds .icon-label { color: #38bdf8; }

    @keyframes fly-kds {
      0%   { opacity: 0; transform: translate(70vw, 0) scale(0.5) rotate(15deg); }
      60%  { opacity: 1; }
      100% { opacity: 1; transform: translate(150px, 0) scale(1) rotate(0deg); }
    }
    @keyframes kds-glow-change {
      to { filter: drop-shadow(0 0 25px rgba(56,189,248,0.8)) drop-shadow(0 0 8px rgba(56,189,248,0.6)); }
    }

    /* KDS Screen Power-On inside SVG */
    .kds-border {
      stroke: #475569;
      animation: kds-power 0.4s ease 2.4s forwards;
    }
    .kds-content {
      opacity: 0;
      animation: fade-in 0.4s ease 2.5s forwards;
    }
    @keyframes kds-power {
      to { stroke: #38bdf8; }
    }

    /* ====== 3. Printer — flies in from FAR BOTTOM DISPLAY EDGE ====== */
    .icon-printer {
      animation: fly-printer 0.9s cubic-bezier(0.16, 1, 0.3, 1) 2.5s forwards, printer-glow-change 0.4s ease 3.7s forwards;
    }
    .icon-printer .icon-label { color: #f59e0b; }

    @keyframes fly-printer {
      0%   { opacity: 0; transform: translate(0, 70vh) scale(0.5) rotate(10deg); }
      60%  { opacity: 1; }
      100% { opacity: 1; transform: translate(0, 130px) scale(1) rotate(0deg); }
    }
    @keyframes printer-glow-change {
      to { filter: drop-shadow(0 0 25px rgba(245,158,11,0.8)) drop-shadow(0 0 8px rgba(245,158,11,0.6)); }
    }

    /* Printer components inside SVG */
    .printer-paper-top {
      fill: #090d16;
      stroke: #475569;
      animation: printer-power-top 0.4s ease 3.7s forwards;
    }
    .printer-led-green { fill: #475569; animation: led-green 0.4s ease 3.7s forwards; }
    .printer-led-amber { fill: #475569; animation: led-amber 0.4s ease 3.7s forwards; }
    .printer-paper-bottom {
      opacity: 0;
      transform: translateY(-4px);
      animation: printer-paper-out 0.5s ease 3.8s forwards;
    }
    .printer-content { opacity: 0; animation: fade-in 0.4s ease 4.0s forwards; }

    @keyframes printer-power-top { to { fill: #334155; stroke: #ffffff; } }
    @keyframes led-green { to { fill: #18ba60; } }
    @keyframes led-amber { to { fill: #f59e0b; } }
    @keyframes printer-paper-out { to { opacity: 1; transform: translateY(0); } }

    /* ====== 4. Web — flies in from FAR TOP DISPLAY EDGE ====== */
    .icon-web {
      animation: fly-web 0.9s cubic-bezier(0.16, 1, 0.3, 1) 3.8s forwards, web-glow-change 0.4s ease 5.0s forwards;
    }
    .icon-web .icon-label { color: #10b981; }

    @keyframes fly-web {
      0%   { opacity: 0; transform: translate(0, -70vh) scale(0.5) rotate(-10deg); }
      60%  { opacity: 1; }
      100% { opacity: 1; transform: translate(0, -130px) scale(1) rotate(0deg); }
    }
    @keyframes web-glow-change {
      to { filter: drop-shadow(0 0 25px rgba(16,185,129,0.8)) drop-shadow(0 0 8px rgba(16,185,129,0.6)); }
    }

    /* Web globe inside SVG */
    .web-globe {
      stroke: #475569;
      animation: web-power 0.4s ease 5.0s forwards;
    }
    .web-content {
      opacity: 0;
      animation: fade-in 0.4s ease 5.1s forwards;
    }
    @keyframes web-power {
      to { stroke: #10b981; }
    }

    /* ====== 5. Central Logo — pops in clear at the center ====== */
    .central-logo {
      position: absolute;
      opacity: 0;
      z-index: 20;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      filter: drop-shadow(0 0 30px rgba(24,186,96,0.7)) drop-shadow(0 0 15px rgba(0,0,0,0.9));
      animation: logo-pop 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) 5.4s forwards;
    }

    .central-logo img {
      width: 110px;
      height: 110px;
      object-fit: contain;
      background: white;
      border-radius: 24px;
      padding: 5px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.7);
    }

    .central-logo .brand-text {
      font-family: 'Segoe UI', system-ui, sans-serif;
      font-size: 20px;
      font-weight: 900;
      color: #ffffff;
      text-shadow: 0 3px 15px rgba(0,0,0,0.95);
      letter-spacing: 1.5px;
    }
    .central-logo .brand-text span { color: #18ba60; }

    @keyframes logo-pop {
      0%   { opacity: 0; transform: scale(0.2); }
      60%  { opacity: 1; transform: scale(1.1); }
      100% { opacity: 1; transform: scale(1); }
    }

    /* ====== Common Fade In animation ====== */
    @keyframes fade-in {
      to { opacity: 1; }
    }

    /* ====== Wires & Cables Container SVG ====== */
    .connection-svg {
      position: absolute;
      width: 600px;
      height: 600px;
      z-index: 1;
      pointer-events: none;
    }
    
    .cable-bg {
      fill: none;
      stroke: #18ba60;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 6px;
      filter: drop-shadow(0 0 4px rgba(24, 186, 96, 0.5));
    }

    .cable-core {
      fill: none;
      stroke: #18ba60;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 2.5px;
      stroke-dasharray: 4 6;
    }

    /* Wires animations */
    .conn-line-kds {
      opacity: 0;
      animation: fade-in-glow 0.4s ease 2.0s forwards;
    }
    .conn-line-kds-core {
      opacity: 0;
      animation: fade-in-core 0.4s ease 2.0s forwards;
    }

    .conn-line-printer {
      opacity: 0;
      animation: fade-in-glow 0.4s ease 3.3s forwards;
    }
    .conn-line-printer-core {
      opacity: 0;
      animation: fade-in-core 0.4s ease 3.3s forwards;
    }

    .conn-line-web {
      opacity: 0;
      animation: fade-in-glow 0.4s ease 4.6s forwards;
    }
    .conn-line-web-core {
      opacity: 0;
      animation: fade-in-core 0.4s ease 4.6s forwards;
    }
    
    @keyframes fade-in-glow {
      to { opacity: 0.25; }
    }
    
    @keyframes fade-in-core {
      to { opacity: 0.9; }
    }

    /* ====== Status Text Floating at Bottom Center of Display ====== */
    .status-container {
      position: fixed;
      bottom: 50px;
      left: 0;
      right: 0;
      margin: 0 auto;
      z-index: 50;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      width: 100%;
      pointer-events: none;
    }

    .status-badge {
      padding: 8px 24px;
      background: rgba(13, 17, 23, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(24, 186, 96, 0.35);
      border-radius: 9999px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 0 15px rgba(24, 186, 96, 0.2);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #18ba60;
      box-shadow: 0 0 10px #18ba60;
      animation: pulse-dot 1.2s infinite ease-in-out;
    }
    @keyframes pulse-dot {
      0%, 100% { transform: scale(0.8); opacity: 0.6; }
      50% { transform: scale(1.3); opacity: 1; }
    }

    .status-text {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-size: 13px;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: 2px;
      text-transform: uppercase;
      text-shadow: 0 0 10px rgba(24, 186, 96, 0.6);
    }
  </style>
</head>
<body>

  <div class="animation-container">
    <!-- Devices and lines in their own layer to support blurring at the end -->
    <div class="devices-layer">
      <svg class="connection-svg" viewBox="0 0 600 600">
        <!-- 1. KDS Cable (Orthogonal path from POS (150, 300) to KDS (450, 300)) -->
        <path class="cable-bg conn-line-kds" d="M 150 300 H 200 V 340 H 400 V 300 H 450" stroke-width="6" stroke-linejoin="round" />
        <path class="cable-core conn-line-kds-core" d="M 150 300 H 200 V 340 H 400 V 300 H 450" stroke-width="2.5" stroke-linejoin="round" />
        
        <!-- KDS Neon Dot Animation -->
        <g opacity="0">
          <circle r="8" fill="#38bdf8" opacity="0.9" style="filter: blur(3px);">
            <animateMotion dur="1.2s" repeatCount="indefinite" path="M 150 300 H 200 V 340 H 400 V 300 H 450" begin="2.4s" />
          </circle>
          <circle r="3" fill="#ffffff" opacity="1">
            <animateMotion dur="1.2s" repeatCount="indefinite" path="M 150 300 H 200 V 340 H 400 V 300 H 450" begin="2.4s" />
          </circle>
          <animate attributeName="opacity" from="0" to="1" begin="2.4s" dur="0.1s" fill="freeze" />
        </g>
        
        <!-- 2. Printer Cable (Orthogonal path from POS (150, 300) to Printer (300, 430)) -->
        <path class="cable-bg conn-line-printer" d="M 150 300 H 200 V 430 H 300" stroke-width="6" stroke-linejoin="round" />
        <path class="cable-core conn-line-printer-core" d="M 150 300 H 200 V 430 H 300" stroke-width="2.5" stroke-linejoin="round" />
        
        <!-- Printer Neon Dot Animation -->
        <g opacity="0">
          <circle r="8" fill="#f59e0b" opacity="0.9" style="filter: blur(3px);">
            <animateMotion dur="1.0s" repeatCount="indefinite" path="M 150 300 H 200 V 430 H 300" begin="3.7s" />
          </circle>
          <circle r="3" fill="#ffffff" opacity="1">
            <animateMotion dur="1.0s" repeatCount="indefinite" path="M 150 300 H 200 V 430 H 300" begin="3.7s" />
          </circle>
          <animate attributeName="opacity" from="0" to="1" begin="3.7s" dur="0.1s" fill="freeze" />
        </g>
        
        <!-- 3. Web Cable (Orthogonal path from POS (150, 300) to Web (300, 170)) -->
        <path class="cable-bg conn-line-web" d="M 150 300 H 200 V 170 H 300" stroke-width="6" stroke-linejoin="round" />
        <path class="cable-core conn-line-web-core" d="M 150 300 H 200 V 170 H 300" stroke-width="2.5" stroke-linejoin="round" />
        
        <!-- Web Neon Dot Animation -->
        <g opacity="0">
          <circle r="8" fill="#10b981" opacity="0.9" style="filter: blur(3px);">
            <animateMotion dur="1.0s" repeatCount="indefinite" path="M 150 300 H 200 V 170 H 300" begin="5.0s" />
          </circle>
          <circle r="3" fill="#ffffff" opacity="1">
            <animateMotion dur="1.0s" repeatCount="indefinite" path="M 150 300 H 200 V 170 H 300" begin="5.0s" />
          </circle>
          <animate attributeName="opacity" from="0" to="1" begin="5.0s" dur="0.1s" fill="freeze" />
        </g>
      </svg>

      <!-- 1. POS Terminal -->
      <div class="icon icon-pos">
        <svg width="140" height="140" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="2" y="3" width="20" height="13" rx="2.5" fill="#1e293b" stroke="#ffffff" stroke-width="1.5"/>
          <path d="M6 16L4 21H20L18 16" stroke="#ffffff" stroke-width="1.5" stroke-linejoin="round"/>
          <rect class="pos-screen" x="7" y="5.5" width="10" height="6" rx="0.5" stroke-width="1"/>
          <g class="pos-content">
            <line x1="9" y1="7.5" x2="15" y2="7.5" stroke="#18ba60" stroke-width="0.8" stroke-linecap="round"/>
            <line x1="9" y1="9.5" x2="13" y2="9.5" stroke="#18ba60" stroke-width="0.8" stroke-linecap="round"/>
          </g>
        </svg>
        <div class="icon-label">POS Terminal</div>
      </div>

      <!-- 2. KDS Display -->
      <div class="icon icon-kds">
        <svg width="140" height="140" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="2" y="4" width="20" height="14" rx="2.5" fill="#1e293b" class="kds-border" stroke-width="1.5"/>
          <g class="kds-content">
            <line x1="6" y1="8" x2="13" y2="8" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round"/>
            <line x1="6" y1="11" x2="10" y2="11" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round"/>
            <line x1="6" y1="14" x2="14" y2="14" stroke="#475569" stroke-width="0.8" stroke-linecap="round"/>
            <rect x="15" y="7.5" width="4" height="6" rx="0.5" fill="#f59e0b" fill-opacity="0.25" stroke="#f59e0b" stroke-width="1"/>
          </g>
        </svg>
        <div class="icon-label">Kitchen Display</div>
      </div>

      <!-- 3. Thermal Printer -->
      <div class="icon icon-printer">
        <svg width="135" height="135" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path class="printer-paper-top" d="M6 9H18V4H6V9Z" stroke-width="1.5"/>
          <rect x="3" y="9" width="18" height="9" rx="2" fill="#1e293b" stroke="#ffffff" stroke-width="1.5"/>
          <circle cx="6" cy="12.5" r="1.2" class="printer-led-green"/>
          <circle cx="9" cy="12.5" r="0.8" class="printer-led-amber"/>
          <path class="printer-paper-bottom" d="M6 18H18V22H6V18Z" fill="#f8fafc" stroke="#ffffff" stroke-width="1.2"/>
          <g class="printer-content">
            <line x1="8.5" y1="19.5" x2="15.5" y2="19.5" stroke="#94a3b8" stroke-width="0.8"/>
            <line x1="8.5" y1="21" x2="13" y2="21" stroke="#94a3b8" stroke-width="0.8"/>
          </g>
        </svg>
        <div class="icon-label">Thermal Printer</div>
      </div>

      <!-- 4. Web Globe -->
      <div class="icon icon-web">
        <svg width="130" height="130" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="12" cy="12" r="9.5" class="web-globe" stroke-width="1.8" fill="#1e293b"/>
          <g class="web-content">
            <path d="M3 9H21M3 15H21" stroke="#10b981" stroke-width="1.2"/>
            <path d="M12 2.5C14.8 5.3 16 8.5 16 12C16 15.5 14.8 18.7 12 21.5C9.2 18.7 8 15.5 8 12C8 8.5 9.2 5.3 12 2.5Z" stroke="#10b981" stroke-width="1.2"/>
          </g>
        </svg>
        <div class="icon-label">Web Platform</div>
      </div>
    </div>

    <!-- 5. Central Logo -->
    <div class="central-logo">
      <img src="logo.png" alt="SaSLoop Logo">
      <div class="brand-text">SaSLoop <span id="brand-sub">Master POS</span></div>
    </div>
  </div>

  <!-- Status Badge at Bottom of Screen -->
  <div class="status-container">
    <div class="status-badge">
      <div class="status-dot"></div>
      <div class="status-text" id="status-text">INITIALIZING SYSTEM...</div>
    </div>
  </div>

  <script>
    const statusText = document.getElementById('status-text');
    const stages = [
      { time: 0, text: 'INITIALIZING SYSTEM...' },
      { time: 100, text: 'POWERING ON POS TERMINAL...' },
      { time: 1200, text: 'CONNECTING KITCHEN DISPLAY (KDS)...' },
      { time: 2500, text: 'CONNECTING THERMAL PRINTER...' },
      { time: 3800, text: 'CONNECTING TO WEB SERVICES...' },
      { time: 5100, text: 'LOADING SYSTEM DATA...' },
      { time: 6000, text: 'SASLOOP MASTER POS READY' }
    ];

    stages.forEach(stage => {
      setTimeout(() => {
        let text = stage.text;
        try {
          const { ipcRenderer } = require('electron');
          ipcRenderer.invoke('is-terminal-mode').then(isTerminal => {
            if (isTerminal) {
              text = text.replace('MASTER POS', 'POS TERMINAL');
            }
            statusText.innerText = text;
          });
        } catch (e) {
          statusText.innerText = text;
        }
      }, stage.time);
    });

    // Detect mode and update UI dynamically
    try {
      const { ipcRenderer } = require('electron');
      ipcRenderer.invoke('is-terminal-mode').then(isTerminal => {
        if (isTerminal) {
          document.getElementById('brand-sub').innerText = 'POS Terminal';
        }
      });
    } catch (e) {
      console.log('Not in Electron');
    }

    // Send transition signal once animation is complete (at 6.8 seconds)
    setTimeout(() => {
      try {
        const { ipcRenderer } = require('electron');
        ipcRenderer.send('app-ready');
      } catch (e) {
        console.log('Not in Electron');
      }
    }, 6800);
  </script>
</body>
</html>
