server {
    client_max_body_size 50M;
    server_name backend.sasloop.in;

    # Dashboard & API
    location / {
        proxy_pass http://localhost:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
    # Serve uploads directly
    location /uploads/ {
        alias /home/ubuntu/SaSLoop/uploads/;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/sasloop.in/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/sasloop.in/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    client_max_body_size 50M;
    listen 80;
    server_name backend.sasloop.in;
    return 301 https://$host$request_uri;
}
